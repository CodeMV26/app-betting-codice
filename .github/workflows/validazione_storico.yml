name: 2. Fase Post-Match - Archiviazione e Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-match:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout del codice repository
      uses: actions/checkout@v4

    - name: 🐍 Configurazione ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installazione dipendenze necessarie
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests numpy

    - name: 🏆 Esegui Validazione Risultati Reali (Modulo 03)
      run: python modulo_03_validatore.py

    - name: 🗄️ Esegui Archiviazione e Rimozione Doppioni (Modulo 04)
      run: python modulo_04_trasferitore.py

    - name: 💾 Salva e pusha le modifiche sui file Excel
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add Storico_Validato_Betting.xlsx Database_Storico_Completo.xlsx || true
        git commit -m "🤖 Post-Match: Storico validato e archiviato senza doppioni (V6.32)" || echo "Nessun dato da aggiornare"
        git push origin main || true
